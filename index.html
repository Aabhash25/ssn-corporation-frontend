<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon - Multiple sizes for better compatibility -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-512x512.png"
    />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Manifest for PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Title -->
    <title>
      SSN Corporation — Engineering, Construction, Infrastructure & R&D
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="SSN Corporation is a multidisciplinary engineering and construction firm headquartered in Raleigh, North Carolina. We provide engineering and general construction services throughout Georgia, North Carolina, and Virginia. Our team delivers comprehensive, end-to-end solutions, including land planning and permitting, building and infrastructure design, site development, structural, geotechnical, water resources, and MEP design and engineering, construction management, pre-construction services, and general construction solutions."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://ssncorporation.com/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ============================================================ -->
    <!-- ⭐ PERFORMANCE: Google Fonts Optimization (NO RENDER BLOCKING) -->
    <!-- ============================================================ -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@400;500;700&display=swap"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
    />

    <!-- Load fonts without blocking render -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Fallback for users with JS disabled -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@400;500;700&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
      />
    </noscript>

    <!-- ============================================================ -->
    <!-- ⭐ STRUCTURED DATA / SCHEMA -->
    <!-- ============================================================ -->

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SSN Corporation",
        "url": "https://ssncorporation.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ssncorporation.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SSN Corporation",
        "url": "https://ssncorporation.com",
        "logo": "https://ssncorporation.com/logo.png",
        "image": "https://ssncorporation.com/logo.png",
        "description": "SSN Corporation is a multidisciplinary engineering and construction firm headquartered in Raleigh, North Carolina.",
        "sameAs": [
          "https://www.facebook.com/ssncorporation",
          "https://www.linkedin.com/company/ssncorporation",
          "https://www.instagram.com/ssncorporation"
        ]
      }
    </script>

    <!-- Breadcrumb Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://ssncorporation.com"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- ⭐ PERFORMANCE: Defer JS (Fix render-blocking) -->
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
